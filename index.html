<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nequi rediseñado: prototipo funcional</title>
<style>
:root{--bg:#f6f2f8;--card:#fff;--ink:#1d1226;--mut:#665a70;--pri:#3b1456;--onp:#fff;--acc:#b3135a;--ok:#13694f;--warn:#9a5a00;--bad:#b3261e;--onbad:#fff;--line:#e2d7e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c1c;--card:#221530;--ink:#f3ecf7;--mut:#b9acc4;--pri:#d9a8f0;--onp:#1d1226;--acc:#ff7eb0;--ok:#5fd3ae;--warn:#f0b24a;--bad:#ff8a80;--onbad:#2a0a08;--line:#3b2b4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c1c;--card:#221530;--ink:#f3ecf7;--mut:#b9acc4;--pri:#d9a8f0;--onp:#1d1226;--acc:#ff7eb0;--ok:#5fd3ae;--warn:#f0b24a;--bad:#ff8a80;--onbad:#2a0a08;--line:#3b2b4c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#v{flex:1;overflow:auto;padding:16px 16px 24px}
h1{margin:0 0 4px;font-size:24px}h2{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin:18px 0 6px}h3{margin:0 0 8px;font-size:20px}p{margin:8px 0}
.mut,small{color:var(--mut)}small{display:block;font-size:13px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--pri);color:var(--onp);font:600 16px inherit;cursor:pointer;margin:8px 0}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.bad{background:var(--bad);color:var(--onbad)}.btn:disabled{opacity:.6}
.lk{background:none;border:0;color:var(--acc);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;min-height:44px;padding:0}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
input[type=checkbox]{width:24px;height:24px;min-height:0;margin:0}label{display:block;font-size:14px;margin-top:8px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.bal{display:flex;justify-content:space-between;align-items:center;background:var(--pri);color:var(--onp);border:0}.bal b{display:block;font-size:30px}.bal small{color:inherit;opacity:.85}
.ic{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid currentColor;background:transparent;color:inherit;font:600 14px inherit;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.qa span{font-size:22px;color:var(--acc)}
.mv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0;color:var(--ink);font:inherit;cursor:pointer}
.mv[aria-pressed=true]{border:2px solid var(--acc)}.am{text-align:right;font-weight:700;white-space:nowrap}.pos,.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bd{display:block;font:600 12px inherit;font-style:normal}
.bn{border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--card)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mut);font:600 12px inherit;cursor:pointer}nav button[aria-current=page]{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
#sh{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center}#sh[hidden]{display:none}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pn{position:relative;width:100%;max-width:440px;max-height:88%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.on{opacity:1}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kp button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 22px inherit;cursor:pointer}.kp button:disabled{opacity:.5}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.on{background:var(--pri)}
.pg{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.pg i{display:block;height:100%;background:var(--acc)}
.scan{position:relative;aspect-ratio:1;border-radius:16px;background:#111;margin:12px 0;overflow:hidden;display:grid;place-items:center;color:#ddd;text-align:center;padding:16px}
.scan:after{content:"";position:absolute;left:10%;right:10%;height:3px;background:#ff4d94;animation:s 2s ease-in-out infinite}
@keyframes s{0%,100%{top:15%}50%{top:85%}}@media(prefers-reduced-motion:reduce){.scan:after{animation:none;top:50%}}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;margin:0}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--ok)}.dt.s{background:var(--warn)}
.er{color:var(--bad);font-size:14px;margin:4px 0;min-height:18px}.big{font-size:44px;line-height:1}
details{padding:8px 0}summary{cursor:pointer;min-height:32px}
</style></head>
<body>
<div id="app"><main id="v" tabindex="-1"></main><nav id="nav" aria-label="Navegación principal" hidden></nav></div>
<div id="sh" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),m=n=>"$ "+Math.abs(n).toLocaleString("es-CO"),
esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
num=v=>parseInt(String(v).replace(/\D/g,""),10)||0;
const ST={ok:["Aprobado","ok","Tu movimiento se completó correctamente."],pend:["Pendiente","warn","Estamos esperando la confirmación. Suele tardar unos minutos; si pasa de un día, repórtalo en Ayuda."],fail:["Fallido","bad","No se completó y no se descontó plata de tu cuenta. Puedes intentarlo de nuevo."]};
const CT=[["Andrés Pérez","300 111 22 33"],["Laura Gómez","301 222 33 44"],["Mamá","310 555 66 77"]];
const S={view:"login",pin:"",fails:0,busy:0,cp:"1234",saldo:1250000,falla:false,lock:false,step:1,to:null,amt:0,tab:"qr",meth:"Tarjeta débito",flt:"all",q:"",
movs:[{id:1,d:"Tienda Don Pepe",t:-18500,s:"ok",f:"Hoy, 9:12 a. m.",r:"A417"},{id:2,d:"Recibido de Laura Gómez",t:120000,s:"ok",f:"Ayer, 6:40 p. m.",r:"B722"},{id:3,d:"Recarga PSE",t:200000,s:"pend",f:"Ayer, 2:05 p. m.",r:"C130"},{id:4,d:"Envío a Andrés Pérez",t:-45000,s:"fail",f:"12 nov, 8:30 a. m.",r:"D551"},{id:5,d:"Pago de servicios",t:-62300,s:"ok",f:"10 nov, 11:15 a. m.",r:"E086"}],
goals:[{id:1,n:"Viaje a Cartagena",g:2000000,a:650000},{id:2,n:"Colchón de emergencia",g:1500000,a:900000}]};
const NAV=[["home","Inicio"],["movs","Movimientos"],["goals","Bolsillos"],["pay","Pagar"],["help","Ayuda"]];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)}
function sheet(h){$("#sh").innerHTML='<div class="bk" data-a="close"></div><div class="pn" role="dialog" aria-modal="true">'+h+'</div>';$("#sh").hidden=false;const f=$("#sh input,#sh select,#sh .btn");f&&f.focus()}
function shut(){$("#sh").hidden=true;$("#sh").innerHTML=""}
const add=(d,t,s)=>S.movs.unshift({id:Date.now(),d,t,s,f:"Hoy, "+new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}),r:"N"+Math.floor(1000+Math.random()*9000)});
const er=t=>{$("#er").textContent=t};
const svc=()=>S.falla?'<div class="bn" role="status"><b>Algunas funciones están lentas.</b> Enviar plata y recargar por PSE pueden fallar. Ingresar, ver tu saldo y pagar con QR siguen funcionando. <button class="lk" data-a="go" data-v="help">Ver estado</button></div>':"";
const guard=()=>S.lock?(sheet('<h3>Cuenta bloqueada temporalmente</h3><p>Activaste el bloqueo, por eso no puedes mover plata. Puedes apagarlo en Ayuda, en «Protege tu cuenta».</p><button class="btn" data-a="go" data-v="help">Ir a Ayuda</button>'),true):false;
const row=x=>`<button class="mv" data-a="det" data-v="${x.id}"><span><b>${esc(x.d)}</b><small>${x.f}</small></span><span class="am ${x.t>0?"pos":""}">${x.t>0?"+":"−"}${m(x.t)}<em class="bd ${ST[x.s][1]}">${ST[x.s][0]}</em></span></button>`;
function list(){const f=S.flt,q=S.q.toLowerCase(),r=S.movs.filter(x=>x.d.toLowerCase().includes(q)&&(f==="all"||(f==="in"&&x.t>0)||(f==="out"&&x.t<0)||(f==="bad"&&x.s!=="ok")));$("#ml").innerHTML=r.length?r.map(row).join(""):'<p class="mut">No encontramos movimientos con esa búsqueda o filtro. Prueba con otro nombre o elige «Todos».</p>'}

const V={
login(){const d=S.fails>=3||S.busy,e=S.fails>=3?"Por seguridad bloqueamos el ingreso. Usa «Olvidé mi clave» para recuperarla.":S.fails?`Clave incorrecta. Te quedan ${3-S.fails} intento${3-S.fails>1?"s":""}.`:"";
return `<h1>Hola, Camila</h1><p class="mut">Ingresa tu clave de 4 dígitos</p>${svc()}<div class="dots" role="img" aria-label="${S.pin.length} de 4 dígitos">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?"on":""}"></i>`).join("")}</div>
<p class="er" role="alert" style="text-align:center">${S.busy===1?'<span class="mut">Verificando…</span>':S.busy===2?'<span class="mut">Leyendo huella…</span>':e}</p>
<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="k" data-v="${n}" ${d?"disabled":""}>${n}</button>`).join("")}<button data-a="bio" aria-label="Ingresar con huella" ${d?"disabled":""}>Huella</button><button data-a="k" data-v="0" ${d?"disabled":""}>0</button><button data-a="k" data-v="d" aria-label="Borrar" ${d?"disabled":""}>⌫</button></div>
<button class="lk" data-a="forgot">Olvidé mi clave</button><div class="bn" style="margin-top:16px"><b>Recuerda:</b> Nequi nunca te pedirá tu clave por llamada, chat o mensaje.</div><p class="mut" style="font-size:13px">Prototipo con datos ficticios. Clave de demostración: 1234.</p>`},
home(){return `<h1>Hola, Camila</h1>${svc()}<section class="card bal"><div><small>Saldo disponible</small><b>${S.hide?"$ ••••••":m(S.saldo)}</b></div><button class="ic" data-a="eye" aria-pressed="${!!S.hide}">${S.hide?"Mostrar":"Ocultar"}</button></section>
<div class="qa">${[["send","Enviar","↗"],["rch","Recargar","＋"],["qr","Pagar QR","▣"],["goals","Metas","★"]].map(([k,t,i])=>`<button data-a="qa" data-v="${k}"><span aria-hidden="true">${i}</span>${t}</button>`).join("")}</div>
<h2>Movimientos recientes<button class="lk" data-a="go" data-v="movs">Ver todos</button></h2>${S.movs.slice(0,3).map(row).join("")}`},
send(){const s=S.step,t=S.to,bk=`<button class="lk" data-a="back">${s===1?"Cancelar":"Atrás"}</button>`;
if(s===1)return `${bk}<h1>¿A quién le envías?</h1><p class="mut">Paso 1 de 3</p>${svc()}${CT.map((c,i)=>`<button class="mv" data-a="pick" data-v="${i}"><span><b>${c[0]}</b><small>${c[1]}</small></span><span aria-hidden="true">›</span></button>`).join("")}<h2>O escribe un número</h2><input id="nm" inputmode="numeric" maxlength="10" placeholder="Celular de 10 dígitos" aria-label="Número de celular"><p class="er" id="er" role="alert"></p><button class="btn sec" data-a="num">Usar este número</button>`;
if(s===2)return `${bk}<h1>¿Cuánto envías?</h1><p class="mut">Paso 2 de 3. Para ${esc(t[0])}</p><input id="am" data-f="m" inputmode="numeric" placeholder="$ 0" aria-label="Monto"><div class="ch">${[10000,20000,50000].map(v=>`<button class="chip" data-a="chip" data-v="${v}">${m(v)}</button>`).join("")}</div><p class="mut">Disponible: ${m(S.saldo)}</p><p class="er" id="er" role="alert"></p><button class="btn" data-a="amt">Continuar</button>`;
if(s===3)return `${bk}<h1>Revisa y confirma</h1><p class="mut">Paso 3 de 3</p><div class="card"><small>Vas a enviar</small><b style="font-size:28px">${m(S.amt)}</b><p>A <b>${esc(t[0])}</b><small>Celular ${esc(t[1])}</small></p></div><div class="bn">Verifica que sea la persona correcta. Si alguien te pidió esta plata con urgencia o por un premio, puede ser una estafa.</div><button class="btn" data-a="conf" ${S.busy?"disabled":""}>${S.busy?"Enviando…":"Confirmar y enviar"}</button>`;
if(s===4)return `<div class="card" style="text-align:center"><div class="big ok" aria-hidden="true">✓</div><h1>¡Plata enviada!</h1><p>${m(S.amt)} a ${esc(t[0])}</p><small>Referencia ${S.movs[0].r}</small></div><button class="btn" data-a="share" data-v="${S.movs[0].id}">Compartir comprobante</button><button class="btn sec" data-a="go" data-v="home">Volver al inicio</button>`;
return `<div class="card"><h1 class="bad">No pudimos enviar tu plata</h1><p><b>Qué pasó:</b> el servicio de envíos está lento en este momento.</p><p><b>Tu plata:</b> sigue en tu cuenta, no se descontó nada.</p><p><b>Qué puedes hacer:</b> reintentar en unos minutos o revisar el estado del servicio.</p></div><button class="btn" data-a="retry">Reintentar</button><button class="btn sec" data-a="go" data-v="help">Ver estado del servicio</button><p class="mut" style="font-size:13px">Demo: apaga la falla simulada en Ayuda para completar el envío.</p>`},
movs(){return `<h1>Movimientos</h1><input id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar movimientos" value="${esc(S.q)}"><div class="ch">${[["all","Todos"],["in","Entradas"],["out","Salidas"],["bad","Con problema"]].map(([k,t])=>`<button class="chip" data-a="flt" data-v="${k}" aria-pressed="${S.flt===k}">${t}</button>`).join("")}</div><div id="ml"></div>`},
goals(){return `<h1>Bolsillos y metas</h1><p class="mut">Plata disponible: ${m(S.saldo)}</p><button class="btn" data-a="gf">Crear una meta</button>${S.goals.length?S.goals.map(g=>{const p=Math.min(100,Math.round(g.a/g.g*100));return `<section class="card"><b>${esc(g.n)}</b><p class="mut" style="margin:4px 0">${m(g.a)} de ${m(g.g)}, ${p} %</p><div class="pg" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de ${esc(g.n)}"><i style="width:${p}%"></i></div><div class="ch" style="margin-top:12px"><button class="chip" data-a="mvg" data-v="${g.id}">Mover plata</button><button class="chip" data-a="del" data-v="${g.id}">Eliminar</button></div></section>`}).join(""):'<p class="mut">Aún no tienes metas. Crea la primera y empieza con lo que puedas.</p>'}`},
pay(){const t=S.tab,tabs=`<div class="ch"><button class="chip" data-a="tab" data-v="qr" aria-pressed="${t==="qr"}">Pagar con QR</button><button class="chip" data-a="tab" data-v="rch" aria-pressed="${t==="rch"}">Recargar</button></div>`;
if(t==="qr")return `<h1>Pagar</h1>${tabs}${svc()}<div class="scan"><span>Apunta al código QR del comercio</span></div><button class="btn" data-a="scan">Simular lectura de un QR</button>`;
return `<h1>Recargar</h1>${tabs}${svc()}<h2>¿Cómo quieres recargar?</h2>${["PSE","Corresponsal bancario","Tarjeta débito"].map(x=>`<button class="mv" data-a="meth" data-v="${x}" aria-pressed="${S.meth===x}"><b>${x}</b><span>${S.meth===x?"Elegido":""}</span></button>`).join("")}<h2>¿Cuánto?</h2><input id="ra" data-f="m" inputmode="numeric" placeholder="$ 0" aria-label="Monto a recargar"><div class="ch">${[20000,50000,100000].map(v=>`<button class="chip" data-a="rchip" data-v="${v}">${m(v)}</button>`).join("")}</div><p class="er" id="er" role="alert"></p><button class="btn" data-a="rc">Continuar</button>`},
help(){const sl=S.falla,it=(n,s)=>`<div class="sr"><span><i class="dt ${s?"s":""}"></i>${n}</span><small>${s?"Lento":"Operativo"}</small></div>`;
return `<h1>Seguridad y ayuda</h1><section class="card"><b>Estado del servicio</b><p class="mut" style="margin:4px 0">Qué funciona y qué no, ahora mismo.</p>${it("Ingreso a la app",0)}${it("Consultar saldo",0)}${it("Enviar plata",sl)}${it("Pagar con QR",0)}${it("Recargar por PSE",sl)}${sl?'<div class="bn">Estamos trabajando para normalizarlo. Si una operación falla, no se descuenta plata de tu cuenta.</div>':""}<label class="sr"><span>Simular una falla (solo para la demo)</span><input type="checkbox" data-a="tfl" ${sl?"checked":""}></label></section>
<section class="card"><b>Protege tu cuenta</b><label class="sr"><span>Bloqueo temporal<small>Impide enviar y pagar hasta que lo apagues</small></span><input type="checkbox" data-a="tlk" ${S.lock?"checked":""}></label><button class="btn sec" data-a="pinf">Cambiar clave</button><button class="btn sec" data-a="fraud">Reportar un fraude</button></section>
<section class="card"><b>Preguntas frecuentes</b><details><summary>¿Qué hago si un envío falla?</summary><p>Revisa el estado del servicio. Si falló, tu plata no se descuenta; reintenta en unos minutos.</p></details><details><summary>¿Nequi me pedirá mi clave?</summary><p>No. Nunca la compartas por llamada, chat o mensaje.</p></details><details><summary>¿Cómo sé si un movimiento está pendiente?</summary><p>En Movimientos verás el estado de cada uno con una explicación.</p></details></section><button class="btn sec" data-a="out">Cerrar sesión</button>`}};

function render(){const l=S.view==="login";$("#nav").hidden=l;$("#v").innerHTML=V[S.view]();$("#nav").innerHTML=NAV.map(([k,t])=>`<button data-a="go" data-v="${k}" ${S.view===k?'aria-current="page"':""}>${t}</button>`).join("");if(S.view==="movs")list()}
const A={
go:v=>{shut();S.view=v;render();$("#v").scrollTop=0},close:shut,
k:v=>{if(S.busy||S.fails>=3)return;if(v==="d")S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=v;if(S.pin.length===4){S.busy=1;render();setTimeout(()=>{S.busy=0;if(S.pin===S.cp){S.pin="";S.fails=0;A.go("home")}else{S.fails++;S.pin="";render()}},700)}else render()},
bio:()=>{if(S.busy)return;S.busy=2;render();setTimeout(()=>{S.busy=0;A.go("home")},900)},
forgot:()=>sheet('<h3>Recuperar clave</h3><p>Te enviaremos un código por mensaje al celular terminado en 42.</p><p class="mut" style="font-size:13px">Demo: el código es 123456.</p><input id="cd" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" aria-label="Código"><p class="er" id="er" role="alert"></p><button class="btn" data-a="code">Verificar código</button>'),
code:()=>{if($("#cd").value==="123456"){S.fails=0;shut();render();toast("Código correcto. Ya puedes ingresar con tu clave.")}else er("El código no coincide. Revisa el mensaje e inténtalo de nuevo.")},
eye:()=>{S.hide=!S.hide;render()},
qa:v=>{if(v==="send")return A.send();if(v==="goals")return A.go("goals");S.tab=v;A.go("pay")},
det:id=>{const x=S.movs.find(v=>v.id==id),s=ST[x.s];sheet(`<h3>${esc(x.d)}</h3><p class="am ${x.t>0?"pos":""}" style="font-size:26px;text-align:left">${x.t>0?"+":"−"}${m(x.t)}</p><p><b class="${s[1]}">${s[0]}</b><br>${s[2]}</p><p class="mut">${x.f}. Referencia ${x.r}</p><button class="btn" data-a="share" data-v="${x.id}">Compartir comprobante</button>`)},
share:id=>{const x=S.movs.find(v=>v.id==id),t=`Comprobante (demo)\n${x.d}\nValor: ${m(x.t)}\nEstado: ${ST[x.s][0]}\nFecha: ${x.f}\nReferencia: ${x.r}`;try{if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast("Comprobante copiado"),()=>toast("No pudimos copiar el comprobante"))}catch(e){toast("No pudimos compartir el comprobante")}},
send:()=>{if(guard())return;Object.assign(S,{view:"send",step:1,to:null,amt:0});render()},
pick:i=>{S.to=CT[i];S.step=2;render()},
num:()=>{const v=$("#nm").value.replace(/\D/g,"");if(!/^3\d{9}$/.test(v))return er("Escribe un celular de 10 dígitos que empiece por 3.");S.to=["Número "+v,v];S.step=2;render()},
chip:v=>{const e=$("#am");e.value=(+v).toLocaleString("es-CO");e.focus()},
amt:()=>{const n=num($("#am").value);if(!n)return er("Escribe cuánto quieres enviar.");if(n>S.saldo)return er(`Solo tienes ${m(S.saldo)} disponibles. Prueba con un monto menor.`);S.amt=n;S.step=3;render()},
back:()=>{if(S.step>1)S.step--;else S.view="home";render()},retry:()=>{S.step=3;render()},
conf:()=>{S.busy=1;render();setTimeout(()=>{S.busy=0;if(S.falla)S.step=5;else{S.saldo-=S.amt;add("Envío a "+S.to[0],-S.amt,"ok");S.step=4}render()},1000)},
flt:v=>{S.flt=v;render()},
gf:()=>sheet('<h3>Nueva meta</h3><label>Nombre<input id="gn" maxlength="30"></label><label>¿Cuánto quieres ahorrar?<input id="gg" data-f="m" inputmode="numeric" placeholder="$ 0"></label><p class="er" id="er" role="alert"></p><button class="btn" data-a="gs">Guardar meta</button>'),
gs:()=>{const n=$("#gn").value.trim(),v=num($("#gg").value);if(!n)return er("Ponle un nombre a tu meta.");if(v<10000)return er("La meta debe ser de al menos $ 10.000.");S.goals.push({id:Date.now(),n,g:v,a:0});shut();render();toast("Meta guardada")},
mvg:id=>{const g=S.goals.find(x=>x.id==id);sheet(`<h3>Mover plata</h3><p class="mut">${esc(g.n)}. Ahorrado: ${m(g.a)}</p><div class="ch"><button class="chip" id="d1" data-a="dir" data-v="1" aria-pressed="true">Agregar a la meta</button><button class="chip" id="d0" data-a="dir" data-v="0" aria-pressed="false">Sacar de la meta</button></div><input id="mm" data-f="m" inputmode="numeric" placeholder="$ 0" aria-label="Monto"><p class="er" id="er" role="alert"></p><button class="btn" data-a="mvs" data-v="${id}">Mover plata</button>`)},
dir:v=>{$("#d1").setAttribute("aria-pressed",v==="1");$("#d0").setAttribute("aria-pressed",v==="0")},
mvs:id=>{const g=S.goals.find(x=>x.id==id),n=num($("#mm").value),a=$("#d1").getAttribute("aria-pressed")==="true";if(!n)return er("Escribe cuánta plata quieres mover.");if(a&&n>S.saldo)return er(`Solo tienes ${m(S.saldo)} disponibles.`);if(!a&&n>g.a)return er(`En esta meta solo hay ${m(g.a)}.`);g.a+=a?n:-n;S.saldo+=a?-n:n;shut();render();toast(a?"Plata agregada a tu meta":"Plata de vuelta en tu saldo")},
del:id=>{const g=S.goals.find(x=>x.id==id);sheet(`<h3>¿Eliminar «${esc(g.n)}»?</h3><p>Los ${m(g.a)} ahorrados vuelven a tu saldo.</p><button class="btn bad" data-a="delok" data-v="${id}">Sí, eliminar</button><button class="btn sec" data-a="close">Cancelar</button>`)},
delok:id=>{const g=S.goals.find(x=>x.id==id);S.saldo+=g.a;S.goals=S.goals.filter(x=>x!==g);shut();render();toast("Meta eliminada")},
tab:v=>{S.tab=v;render()},meth:v=>{S.meth=v;render()},rchip:v=>{$("#ra").value=(+v).toLocaleString("es-CO")},
scan:()=>{if(guard())return;if(S.saldo<18500)return toast("Tu saldo no alcanza para este pago. Recarga y vuelve a intentarlo.");sheet(`<h3>Pagar con QR</h3><div class="card"><small>Comercio</small><b>Tienda Don Pepe</b><small style="margin-top:8px">Total a pagar</small><b style="font-size:26px">${m(18500)}</b></div><p class="mut">Después de pagar te quedarán ${m(S.saldo-18500)}.</p><button class="btn" data-a="payok">Pagar ${m(18500)}</button><button class="btn sec" data-a="close">Cancelar</button>`)},
payok:(v,b)=>{b.disabled=true;b.textContent="Pagando…";setTimeout(()=>{S.saldo-=18500;add("Tienda Don Pepe",-18500,"ok");sheet(`<div style="text-align:center"><div class="big ok" aria-hidden="true">✓</div><h3>¡Pago exitoso!</h3><p>${m(18500)} a Tienda Don Pepe</p></div><button class="btn" data-a="share" data-v="${S.movs[0].id}">Compartir comprobante</button><button class="btn sec" data-a="go" data-v="home">Ir al inicio</button>`);render()},900)},
rc:()=>{const n=num($("#ra").value);if(!n)return er("Escribe cuánto quieres recargar.");sheet(`<h3>Confirma tu recarga</h3><p>Recargarás <b>${m(n)}</b> con <b>${S.meth}</b>.</p><button class="btn" data-a="rcok" data-v="${n}">Confirmar recarga</button><button class="btn sec" data-a="close">Cancelar</button>`)},
rcok:(n,b)=>{n=+n;b.disabled=true;b.textContent="Procesando…";setTimeout(()=>{const p=S.falla&&S.meth==="PSE";if(!p)S.saldo+=n;add("Recarga "+S.meth,n,p?"pend":"ok");sheet(`<h3>${p?"Recarga pendiente":"¡Recarga lista!"}</h3><p>${p?"PSE está lento y tu recarga quedó pendiente. La verás en Movimientos y te avisaremos cuando se confirme.":"Ya tienes "+m(n)+" más en tu saldo."}</p><button class="btn" data-a="go" data-v="home">Ir al inicio</button>`);render()},900)},
tfl:()=>{S.falla=!S.falla;render();toast(S.falla?"Falla simulada activada":"Servicio normalizado")},
tlk:()=>{S.lock=!S.lock;render();toast(S.lock?"Cuenta bloqueada temporalmente":"Bloqueo apagado")},
pinf:()=>sheet(`<h3>Cambiar clave</h3>${["Clave actual","Clave nueva","Repite la clave nueva"].map((t,i)=>`<label>${t}<input id="p${i}" type="password" inputmode="numeric" maxlength="4"></label>`).join("")}<p class="er" id="er" role="alert"></p><button class="btn" data-a="pins">Guardar clave</button>`),
pins:()=>{const[a,b,c]=[0,1,2].map(i=>$("#p"+i).value);if(a!==S.cp)return er("La clave actual no coincide.");if(!/^\d{4}$/.test(b))return er("La clave nueva debe tener 4 números.");if(b===a)return er("Elige una clave distinta a la actual.");if(c!==b)return er("Las claves nuevas no coinciden.");S.cp=b;shut();toast("Clave actualizada. Úsala en tu próximo ingreso.")},
fraud:()=>sheet('<h3>Reportar un fraude</h3><label>¿Qué pasó?<select id="ft"><option>Me pidieron mi clave</option><option>Hay un pago que no reconozco</option><option>Recibí un mensaje o llamada sospechosa</option><option>Otro</option></select></label><label>Cuéntanos más (opcional)<textarea id="fd" rows="3" maxlength="300"></textarea></label><button class="btn" data-a="fr">Enviar reporte</button>'),
fr:()=>sheet(`<h3>Recibimos tu reporte</h3><p>Caso <b>#NQ-${Math.floor(10000+Math.random()*90000)}</b>. Mientras lo revisamos, no compartas tu clave con nadie. Si crees que alguien entró a tu cuenta, bloquéala ahora.</p><button class="btn" data-a="lkon">Activar bloqueo temporal</button><button class="btn sec" data-a="close">Ahora no</button>`),
lkon:()=>{S.lock=true;shut();render();toast("Cuenta bloqueada temporalmente")},
out:()=>{S.view="login";S.pin="";render()}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){S.q=t.value;list()}if(t.dataset.f==="m"){const n=num(t.value);t.value=n?n.toLocaleString("es-CO"):""}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
render();
</script></body></html>
